rial, sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#141414">determines the</text><text x="638" y="432" font-family="Nimbus Sans, Arial, sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#141414">qualified service set.</text><path d="M873,290 H897 M885,278 L897,290 L885,302" fill="none" stroke="#141414" stroke-width="3"/><rect x="903" y="188" width="249" height="265" fill="#FFAF00" stroke="#141414" stroke-width="2"/><text x="923" y="225" font-family="Nimbus Sans, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="0" fill="#141414">04</text><g transform="translate(923 249) scale(0.82)" fill="none" stroke="#141414" stroke-width="3" stroke-linejoin="miter"><circle cx="32" cy="32" r="28"/><path d="M17,32 L28,43 L47,22"/></g><text x="923" y="336" font-family="Nimbus Sans, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="0" fill="#141414">EARN QWC</text><text x="923" y="376" font-family="Nimbus Sans, Arial, sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#141414">Qualified nodes enter</text><text x="923" y="404" font-family="Nimbus Sans, Arial, sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#141414">the scheduled</text><text x="923" y="432" font-family="Nimbus Sans, Arial, sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#141414">reward rotation.</text><rect x="48" y="484" width="1104" height="64" fill="#141414" stroke="none" stroke-width="0"/><text x="70" y="525" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="0" fill="#F5F1E7">RandomX produces blocks. EPoSe rewards qualified network service.</text><path d="M48,580 L1152,580" fill="none" stroke="#141414" stroke-width="2"/><text x="48" y="622" font-family="Nimbus Sans, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="3" fill="#141414">QWERTYCOIN</text><text x="937" y="622" font-family="Nimbus Sans, Arial, sans-seri