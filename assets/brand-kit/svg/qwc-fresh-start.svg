<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="444" viewBox="0 0 1200 444"><title>qwc-fresh-start</title><rect x="0" y="0" width="1200" height="444" fill="#F5F1E7" stroke="none" stroke-width="0"/><text x="48" y="64" font-family="Nimbus Sans, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="2" fill="#141414">A FRESH START</text><path d="M48,91 L1152,91" fill="none" stroke="#FFAF00" stroke-width="5"/><text x="48" y="264" font-family="Nimbus Sans, Arial, sans-serif" font-size="184" font-weight="700" letter-spacing="0" fill="#141414">0</text><text x="170" y="192" font-family="Nimbus Sans, Arial, sans-serif" font-size="43" font-weight="700" letter-spacing="0" fill="#141414">BLOCK</text><text x="170" y="249" font-family="Nimbus Sans, Arial, sans-serif" font-size="31" font-weight="400" letter-spacing="0" fill="#141414">Fresh genesis</text><path d="M558,134 L558,286" fill="none" stroke="#605C54" stroke-width="2"/><text x="613" y="193" font-family="Nimbus Sans, Arial, sans-serif" font-size="59" font-weight="700" letter-spacing="0" fill="#141414">NO PREMINE</text><text x="613" y="249" font-family="Nimbus Sans, Arial, sans-serif" font-size="29" font-weight="400" letter-spacing="0" fill="#141414">No private bootstrap allocation.</text><text x="48" y="333" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#141414">Legacy wallet balances and rehearsal-chain balances are not carried over.</text><path d="M48,370 L1152,370" fill="none" stroke="#141414" stroke-width="2"/><text x="48" y="412" font-family="Nimbus Sans, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="3" fill="#141414">QWERTYCOIN</text><text x="937" y="412" font-family="Nimbus Sans, Arial, sans-serif" font-size="24" font-weight="400" letter-spacing="0" fill="#141414">qwertycoin.org</text></svg>