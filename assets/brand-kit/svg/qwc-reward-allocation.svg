<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="574" viewBox="0 0 1200 574"><title>qwc-reward-allocation</title><rect x="0" y="0" width="1200" height="574" fill="#F5F1E7" stroke="none" stroke-width="0"/><text x="48" y="63" font-family="Nimbus Sans, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="0" fill="#141414">ONE BLOCK SUBSIDY. TWO ROLES.</text><path d="M48,92 L1152,92" fill="none" stroke="#FFAF00" stroke-width="5"/><text x="48" y="140" font-family="Nimbus Sans, Arial, sans-serif" font-size="29" font-weight="400" letter-spacing="0" fill="#605C54">When a qualified EPoSe payee exists</text><rect x="48" y="175" width="1104" height="56" fill="#FFAF00" stroke="none" stroke-width="0"/><rect x="48" y="175" width="993.6" height="56" fill="#141414" stroke="none" stroke-width="0"/><text x="48" y="334" font-family="Nimbus Sans, Arial, sans-serif" font-size="97" font-weight="700" letter-spacing="0" fill="#141414">90%</text><text x="288" y="282" font-family="Nimbus Sans, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0" fill="#141414">RANDOMX MINER</text><text x="288" y="324" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="0" fill="#141414">Remaining block subsidy</text><text x="745" y="334" font-family="Nimbus Sans, Arial, sans-serif" font-size="97" font-weight="700" letter-spacing="0" fill="#141414">10%</text><text x="48" y="405" font-family="Nimbus Sans, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="0" fill="#141414">100% of transaction fees go to the miner.</text><text x="745" y="381" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="0" fill="#141414">EPoSe SERVICE REWARD</text><text x="48" y="457" font-family="Nimbus Sans, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#141414">Without a qualified payee, the miner receives the full subsidy and fees.</text><path d="M48,500 L1152,500" fill="none" stroke="#141414" stroke-width="2"/><text x="48" y="542" font-family="Nimbus Sans, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="3" fill="#141414">QWERTYCOIN</text><text x="937" y="542" font-family="Nimbus Sans, Arial, sans-serif" font-size="24" font-weight="400" letter-spacing="0" fill="#141414">qwertycoin.org</text></svg>